[build]
  command = "npm install --legacy-peer-deps --no-audit --no-fund && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/discovery"
  to = "/.netlify/functions/discovery"
  status = 200

[[redirects]]
  from = "/api/rpc"
  to = "/.netlify/functions/rpc"
  status = 200

[build.environment]
  NODE_VERSION = "20"
